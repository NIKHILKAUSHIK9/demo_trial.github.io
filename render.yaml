# Render.com blueprint: full app (page + Python backend with IRSA / PARSEC). Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: starnest-ocmass
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
